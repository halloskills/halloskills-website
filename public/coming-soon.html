<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>HalloSkills – Bald hier</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: #004b76;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      text-align: center;
      max-width: 480px;
    }
    .eyebrow {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #d4af37;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.2;
      margin-bottom: 1.25rem;
    }
    p {
      font-size: 1rem;
      line-height: 1.7;
      color: rgba(255,255,255,0.75);
      margin-bottom: 2.5rem;
    }
    .domain {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">HalloSkills GmbH</p>
    <h1>Bald hier: HalloSkills</h1>
    <p>Wir bereiten etwas vor. Schau bald wieder vorbei.</p>
    <span class="domain">halloskills.de</span>
  </div>
</body>
</html>
